<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pannello Dipendente</title>
  <link rel="stylesheet" href="CSS/style.css">
  <link rel="stylesheet" href="CSS/dipendente.css">
</head>
<body>

  <div class="navbar">
    <img src="img/logo.png" class="logo" alt="Logo Poste"/>
    <h1><strong>Pannello Dipendente</strong></h1>
    <button id="logoutBtn" class="btn-login">Logout</button>
  </div>

  <main>
    <h1>Pannello Dipendente</h1>

    <div id="currentBox">
      <h2>Attualmente stai servendo: <span id="currentInfo">Nessun utente</span></h2>
    </div>

    <table id="queueTable">
      <thead>
        <tr>
          <th>Numero</th>
          <th>Servizio</th>
          <th>Tempo Stimato (min)</th>
        </tr>
      </thead>
      <tbody id="queueBody">
        <tr><td colspan="3">Nessun utente in attesa</td></tr>
      </tbody>
    </table>

    <div class="btn-container">
      <button id="nextBtn">Passa al prossimo</button>
      <button id="endBtn">Termina servizio</button>
    </div>
  </main>

  <!-- Keycloak JS -->
  <script src="https://cdn.jsdelivr.net/npm/keycloak-js@23.0.3/dist/keycloak.min.js"></script>

  <script>
    // Initialize Keycloak client
    const keycloak = new Keycloak({
      url: "http://localhost:8080",
      realm: "PosteApp",
      clientId: "poste-frontend"
    });

    async function initKeycloak() {
      try {
        const authenticated = await keycloak.init({ onLoad: "check-sso" });
        if (!authenticated) {
          window.location.href = "login.html";
          return;
        }

        // Handle logout
        document.getElementById("logoutBtn").addEventListener("click", () => {
          keycloak.logout({ redirectUri: "http://localhost:3000/utente.html" });
        });
      } catch (err) {
        console.error("Errore inizializzazione Keycloak:", err);
        window.location.href = "login.html";
      }
    }

    initKeycloak();

    // === Queue Logic (unchanged) ===
    const queueBody = document.getElementById("queueBody");
    const currentInfo = document.getElementById("currentInfo");
    let currentUser = JSON.parse(localStorage.getItem("currentUser"));

    const aggiornaTabella = () => {
      let queue = JSON.parse(localStorage.getItem("queue") || "[]");
      queueBody.innerHTML = "";

      if (queue.length === 0) {
        queueBody.innerHTML = "<tr><td colspan='3'>Nessun utente in attesa</td></tr>";
        return;
      }

      queue.forEach(u => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${u.numero.toString().padStart(3, '0')}</td>
          <td>${u.servizio}</td>
          <td>${u.tempo}</td>
        `;
        queueBody.appendChild(tr);
      });
    };

    const aggiornaStatus = () => {
      if (currentUser) {
        currentInfo.textContent = `Numero ${currentUser.numero.toString().padStart(3, '0')} - ${currentUser.servizio}`;
      } else {
        currentInfo.textContent = "Nessun utente";
      }
    };

    document.getElementById("nextBtn").addEventListener("click", () => {
      let queue = JSON.parse(localStorage.getItem("queue") || "[]");

      if (queue.length === 0) {
        currentInfo.textContent = "Nessun utente in attesa.";
        return;
      }

      currentUser = queue.shift();
      localStorage.setItem("queue", JSON.stringify(queue));
      localStorage.setItem("currentUser", JSON.stringify(currentUser));

      aggiornaStatus();
      aggiornaTabella();
    });

    document.getElementById("endBtn").addEventListener("click", () => {
      currentUser = null;
      localStorage.removeItem("currentUser");
      aggiornaStatus();
    });

    aggiornaTabella();
    aggiornaStatus();
  </script>
</body>
</html>
