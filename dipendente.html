<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pannello Dipendente</title>
  <style>
    :root {
      --blu-poste: #0053a0;
      --giallo-poste: #ffcc00;
      --grigio-chiaro: #f4f6f8;
      --color-blue-light: #478eb9;
      --color-yellow-accent: #fcce43;
      --color-bg-light: #fefefe;
      --color-text: #333;
      --color-border-light: #eee;
    }

    .navbar {
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      display: flex;
      height: 100px;
      width: 98%;
      border-bottom: 2px solid var(--color-blue-light);
      background-color: var(--color-bg-light);
      padding: 0 20px;
      box-sizing: border-box;
    }

    .logo { height: 80px; width: auto; }

    .navbar h1 {
      font-size: 32px;
      color: var(--color-blue-light);
      margin: 0;
    }

    .btn-login {
      background-color: var(--color-yellow-accent);
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      color: #222;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn-login:hover { background-color: #ffd84d; }

    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #fff;
      color: var(--color-text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0;
      margin: 0;
    }

    main {
      padding: 40px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 { color: var(--blu-poste); font-size: 36px; margin-bottom: 20px; }

    #currentBox {
      width: 95%;
      max-width: 1100px;
      background-color: white;
      border: 4px solid var(--blu-poste);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 25px;
      text-align: center;
      box-shadow: 0 3px 8px rgba(0,0,0,0.15);
    }

    #currentBox h2 {
      margin: 0;
      color: var(--blu-poste);
      font-size: 26px;
      font-weight: 700;
    }

    #currentBox span { color: var(--giallo-poste); font-size: 24px; font-weight: 700; }

    table {
      width: 95%;
      max-width: 1100px;
      border-collapse: collapse;
      background-color: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 3px 8px rgba(0,0,0,0.15);
    }

    th, td {
      padding: 18px;
      text-align: center;
      border-bottom: 1px solid #ddd;
      font-size: 18px;
    }

    th {
      background-color: var(--blu-poste);
      color: white;
      font-size: 20px;
    }

    tr:nth-child(even) { background-color: #f9f9f9; }
    tr:hover { background-color: var(--giallo-poste); color: #000; transition: 0.2s; }

    .btn-container {
      display: flex;
      gap: 20px;
      margin-top: 40px;
    }

    .btn-container button {
      padding: 15px 30px;
      font-size: 18px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: white;
      transition: 0.3s;
      box-shadow: 0 3px 6px rgba(0,0,0,0.15);
    }

    #nextBtn { background-color: #4caf50; }
    #nextBtn:hover { background-color: #43a047; }

    #endBtn { background-color: #e53935; }
    #endBtn:hover { background-color: #c62828; }

    @media screen and (max-width: 660px) {
      .navbar h1 { font-size: 22px; }
      .btn-login { font-size: 14px; padding: 8px 12px; }
    }
  </style>
</head>
<body>

  <div class="navbar">
    <img src="img/logo.png" class="logo" alt="Logo Poste"/>
    <h1><strong>Pannello Dipendente</strong></h1>
    <button id="logoutBtn" class="btn-login">Logout</button>
  </div>

  <main>
    <h1>Pannello Dipendente</h1>

    <div id="currentBox">
      <h2>Attualmente stai servendo: <span id="currentInfo">Nessun utente</span></h2>
    </div>

    <table id="queueTable">
      <thead>
        <tr>
          <th>Numero</th>
          <th>Servizio</th>
          <th>Tempo Stimato (min)</th>
        </tr>
      </thead>
      <tbody id="queueBody">
        <tr><td colspan="3">Nessun utente in attesa</td></tr>
      </tbody>
    </table>

    <div class="btn-container">
      <button id="nextBtn">Passa al prossimo</button>
      <button id="endBtn">Termina servizio</button>
    </div>
  </main>

  <!-- Keycloak JS -->
  <script src="https://cdn.jsdelivr.net/npm/keycloak-js@23.0.3/dist/keycloak.min.js"></script>

  <script>
    // Initialize Keycloak client
    const keycloak = new Keycloak({
      url: "http://localhost:8080",
      realm: "PosteApp",
      clientId: "poste-frontend"
    });

    async function initKeycloak() {
      try {
        const authenticated = await keycloak.init({ onLoad: "check-sso" });
        if (!authenticated) {
          window.location.href = "login.html";
          return;
        }

        // Handle logout
        document.getElementById("logoutBtn").addEventListener("click", () => {
          keycloak.logout({ redirectUri: "http://localhost:3000/utente.html" });
        });
      } catch (err) {
        console.error("Errore inizializzazione Keycloak:", err);
        window.location.href = "login.html";
      }
    }

    initKeycloak();

    // === Queue Logic (unchanged) ===
    const queueBody = document.getElementById("queueBody");
    const currentInfo = document.getElementById("currentInfo");
    let currentUser = JSON.parse(localStorage.getItem("currentUser"));

    const aggiornaTabella = () => {
      let queue = JSON.parse(localStorage.getItem("queue") || "[]");
      queueBody.innerHTML = "";

      if (queue.length === 0) {
        queueBody.innerHTML = "<tr><td colspan='3'>Nessun utente in attesa</td></tr>";
        return;
      }

      queue.forEach(u => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${u.numero.toString().padStart(3, '0')}</td>
          <td>${u.servizio}</td>
          <td>${u.tempo}</td>
        `;
        queueBody.appendChild(tr);
      });
    };

    const aggiornaStatus = () => {
      if (currentUser) {
        currentInfo.textContent = `Numero ${currentUser.numero.toString().padStart(3, '0')} - ${currentUser.servizio}`;
      } else {
        currentInfo.textContent = "Nessun utente";
      }
    };

    document.getElementById("nextBtn").addEventListener("click", () => {
      let queue = JSON.parse(localStorage.getItem("queue") || "[]");

      if (queue.length === 0) {
        currentInfo.textContent = "Nessun utente in attesa.";
        return;
      }

      currentUser = queue.shift();
      localStorage.setItem("queue", JSON.stringify(queue));
      localStorage.setItem("currentUser", JSON.stringify(currentUser));

      aggiornaStatus();
      aggiornaTabella();
    });

    document.getElementById("endBtn").addEventListener("click", () => {
      currentUser = null;
      localStorage.removeItem("currentUser");
      aggiornaStatus();
    });

    aggiornaTabella();
    aggiornaStatus();
  </script>
</body>
</html>
