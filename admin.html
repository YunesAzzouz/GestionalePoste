<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pannello Admin - Statistiche</title>
  <link rel="stylesheet" href="CSS/admin.css">
  <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
  <div class="navbar">
    <img src="img/logo.png" alt="Logo Poste" class="logo" />
    <h1><strong>Pannello Amministratore</strong></h1>
    <button class="btn-logout">Logout</button>
  </div>

  <main>
    <h2>Statistiche Clienti Serviti</h2>

    <div class="filter-bar">
      <button id="filter-day">Giorno</button>
      <button id="filter-week">Settimana</button>
      <button id="filter-month">Mese</button>
    </div>

    <section>
      <div class="summary-box">
        <h3> Clienti serviti per ogni servizio</h3>
        <table>
          <thead>
            <tr>
              <th>Servizio</th>
              <th>Numero Clienti</th>
            </tr>
          </thead>
          <tbody id="servicesTable">
            <tr><td colspan="2">Caricamento...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section>
      <div class="summary-box">
        <h3> Clienti serviti per sportello e tipo di servizio</h3>
        <table>
          <thead>
            <tr>
              <th>Sportello</th>
              <th>Servizio</th>
              <th>Clienti Serviti</th>
            </tr>
          </thead>
          <tbody id="sportelliTable">
            <tr><td colspan="3">Caricamento...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/keycloak-js@23.0.3/dist/keycloak.min.js"></script>
  <script src="scripts/keycloak.js"></script>
  <script src="scripts/admin.js"></script>
</body>
</html>
