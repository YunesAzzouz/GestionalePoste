version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  keycloak:
    build:
      context: ./docker/key-cloak
      dockerfile: Dockerfile
    container_name: keycloak
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    ports:
      - "8080:8080"
    restart: always
    volumes:
      - keycloak_data:/opt/keycloak/data

  app:
    build: .
    container_name: gestionale-poste
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - mongo
      - keycloak
    environment:
      - MONGODB_URI=mongodb://mongo:27017/GestionalePoste
    volumes:
      - .:/usr/src/app

volumes:
  mongo_data:
  keycloak_data: