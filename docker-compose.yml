version: "3.8"

services:
  keycloak:
    build:
      context: ./docker/keycloak
      dockerfile: Dockerfile
    container_name: keycloak
    ports:
      - "8080:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    volumes:
      - keycloak_data:/opt/keycloak/data

  backend:
    build:
      context: ./docker/backend
      dockerfile: Dockerfile
    container_name: gestionale-poste
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=${mongodb+srv://Giorgia7:100602@servizi.pjgbb1q.mongodb.net/}
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=poste-realm
      - KEYCLOAK_CLIENT=poste-client
    depends_on:
      - keycloak
    restart: unless-stopped

volumes:
  keycloak_data:
