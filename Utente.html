<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biglietteria Dinamica</title>
  <link rel="stylesheet" href="CSS/Utente.css" />
  <link rel="stylesheet" href="CSS/style.css" />
  <style>
    /* Just for demo */
    .ticket-box {
      width: 100%;
      max-width: 300px;
      margin: 0 auto 40px auto;
      padding: 25px;
      border-radius: 6px;
      background-color:var(--color-yellow-accent);
      border: 1px solid var(--color-border-light);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }
  </style>
</head>
<body>
  <div class="navbar">
    <img src="img/logo.png" class="logo" />
    <h1><strong>Biglietteria</strong></h1>
    <button class="btn-login">Loggati se fai parte del nostro team</button>
    <button class="btn-logout">Log Out</button>
  </div>

  <br />

  <div class="container-biglietto">
    <div id="selezione-operazione">
      <h2>Seleziona l'Operazione</h2>
      <select id="operazione-scelta" name="operazione">
        <option value="">-- Seleziona un'operazione --</option>
        <option value="Pagamento bollette/bollettini">Pagamento bollette/bollettini</option>
        <option value="Invio pacchi/lettere">Invio pacchi/lettere</option>
        <option value="Ritiro pacchi/lettere">Ritiro pacchi/lettere</option>
        <option value="Pagamento bollo auto e moto">Pagamento bollo auto e moto</option>
        <option value="Ricarica Postepay">Ricarica Postepay</option>
        <option value="Ricarica telefonica">Ricarica telefonica</option>
        <option value="Bonifico">Bonifico</option>
        <option value="Ritiro pensione">Ritiro pensione</option>
        <option value="Deposito denaro">Deposito denaro</option>
        <option value="Ritiro denaro">Ritiro denaro</option>
        <option value="Apertura conto Poste">Apertura conto Poste</option>
        <option value="Richiesta passaporto">Richiesta passaporto</option>
      </select>
      <br /><br />

      <button class="btn-genera-biglietto"><strong>CREA BIGLIETTO</strong></button>

      <br /><br />

      <div id="biglietto-emesso" class="ticket-box" style="display:none;">
        <h3>IL TUO BIGLIETTO</h3>
        <div class="dettaglio-biglietto">
          <p><strong>Numero Ticket:</strong></p>
          <span id="ticket-numero" class="ticket-output"></span>
        </div>
        <div class="dettaglio-biglietto">
          <p><strong>Operazione:</strong></p>
          <span id="ticket-operazione" class="ticket-output"></span>
        </div>
        <div class="dettaglio-biglietto">
          <p><strong>Sportello di Riferimento:</strong></p>
          <span id="ticket-sportello" class="ticket-output"></span>
        </div>
      </div>
    </div>
  </div>

  <h2>TEMPI DI ATTESA STIMATI</h2>
  <br />
  <table class="tabella-attesa">
    <thead>
      <tr class="riga">
        <th>Sportello</th>
        <th>Numero Ticket</th>
        <th>Tempo Rimanente</th>
      </tr>
    </thead>
    <tbody>
      <tr class="riga">
        <td>1</td>
        <td>A001</td>
        <td>5 min</td>
      </tr>
      <tr class="riga">
        <td>2</td>
        <td>B041</td>
        <td>12 min</td>
      </tr>
      <tr class="riga">
        <td>3</td>
        <td>C015</td>
        <td>2 min</td>
      </tr>
    </tbody>
  </table>
  <script src="https://cdn.jsdelivr.net/npm/keycloak-js@23.0.3/dist/keycloak.min.js"></script>
  <script src="scripts/keycloak.js"></script>
  <script src="scripts/ticket.js"></script>
</body>
</html>
